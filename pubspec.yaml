name: campus_xerox
description: "Campus Xerox - Real-time Print & Document Management with Supabase"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  file_picker: ^8.1.7
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  uuid: ^4.5.1
  path: ^1.9.1
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  pdfx: ^2.11.0
  url_launcher: ^6.3.3
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
